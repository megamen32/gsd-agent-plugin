name: Sync upstream GSD

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-gsd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Refresh upstream payload and reapply overlay
        # Force a rebuild even when the version is unchanged. A fresh Actions
        # checkout intentionally has no ignored node_modules, and the rebuild
        # is the real canary that the current upstream package still accepts
        # our overlay before the suite exercises the generated SDK payload.
        run: python3 scripts/sync_upstream.py --force
      - name: Validate generated package
        run: |
          python3 scripts/test_policy.py --mode release
      - name: Commit verified upstream update
        run: |
          if git diff --quiet; then
            echo "Already current"
            exit 0
          fi
          git config user.name "gsd-upstream-bot"
          git config user.email "gsd-upstream-bot@users.noreply.github.com"
          git add -- .
          git commit -m "chore: sync upstream GSD $(cat VERSION)"
          git push origin HEAD:main
